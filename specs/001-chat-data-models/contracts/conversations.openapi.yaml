openapi: 3.0.3
info:
  title: Conversations API
  description: CRUD operations for conversation management with user isolation
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Development server

security:
  - BearerAuth: []

paths:
  /conversations:
    get:
      summary: List user's conversations
      description: Returns all conversations belonging to the authenticated user in reverse chronological order
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationResponse'

    post:
      summary: Create new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreate'
      responses:
        '201':
          description: Conversation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'

  /conversations/{conversation_id}:
    get:
      summary: Get conversation by ID
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Conversation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'

    put:
      summary: Update conversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationUpdate'
      responses:
        '200':
          description: Conversation updated successfully

    delete:
      summary: Delete conversation
      description: Deletes conversation and all associated messages (cascade delete)
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Conversation deleted successfully

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ConversationCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 255
          example: "Project planning discussion"

    ConversationUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 255

    ConversationResponse:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        user_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
